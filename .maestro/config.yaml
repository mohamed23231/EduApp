flows:
  - flows/*

# Utility flows (hide-keyboard helpers) are tagged `util` and excluded from the
# top-level run so they only execute when explicitly invoked via runFlow.
excludeTags:
  - util

executionOrder:
  continueOnFailure: false
  flowsOrder:
    - auth-login
    - onboarding
    - teacher-dashboard
    - teacher-student-list
    - teacher-attendance
    - parent-dashboard
    - parent-notifications
