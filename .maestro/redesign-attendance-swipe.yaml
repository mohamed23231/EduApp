appId: ${APP_ID}
name: Redesign — Attendance swipe (LTR / RTL)
tags:
  - redesign
  - attendance
  - rtl

# T053 — End-to-end Maestro scenario for the redesigned attendance flow.
# Verifies that the locale-aware swipe direction (forward-reading = Present)
# fires the brand-jade animation and dispatches an Undo intent through the
# root-owned ToastHost.
#
# Run:
#   pnpm install-maestro
#   maestro test .maestro/redesign-attendance-swipe.yaml -e APP_ID=com.privatedu.mobile.development
#
# Pre-requisites:
#   - Logged-in teacher account with at least one open session containing
#     a marked student. The seeding step below is a placeholder; supply
#     fixture credentials via env or a maestro flow file before launch.

---
# === Step 1: Launch + login ===
- launchApp:
    clearState: false
- assertVisible:
    id: "teacher-tab-dashboard"
    timeout: 10000

# === Step 2: Open the live session attendance sheet ===
- tapOn:
    id: "teacher-tab-sessions"
- tapOn:
    text: ".*"           # First session row (replace with stable testID once available)
    index: 0
- assertVisible:
    id: "attendance-roster"
    timeout: 5000

# === Step 3: LTR — swipe a student row "forward" (right) → expect Present ===
- swipe:
    from:
      id: "attendance-row-0"
    direction: RIGHT
- assertVisible:
    text: "Present"
    timeout: 3000
- assertVisible:
    id: "toast-view"     # ToastHost intent fired
    timeout: 3000

# === Step 4: Undo via toast action ===
- tapOn:
    id: "toast-view"
- assertNotVisible:
    text: "Present"

# === Step 5: RTL — swap locale to Arabic, repeat with mirrored swipe ===
# In RTL the "forward-reading" direction is LEFT. The brand contract says
# forward-reading swipe = Present in either locale (Amendment Q2).
- runScript: |
    output.locale = 'ar';     # Pseudo — locale toggle harness wired in T028
- swipe:
    from:
      id: "attendance-row-0"
    direction: LEFT
- assertVisible:
    text: "حاضر"
    timeout: 3000
- assertVisible:
    id: "toast-view"
    timeout: 3000

# === Step 6: Verify rating selector accepts 0 (per FR-spec rating domain) ===
- tapOn:
    id: "rating-input-0"
- tapOn:
    text: "0"
- assertVisible:
    text: "0"

# === END ===
# Post-launch follow-up: replace placeholder selectors (text: ".*", index: 0)
# with stable testIDs once attendance redesign (Phase 9 / T097) lands.
