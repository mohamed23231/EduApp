appId: ${APP_ID}
name: parent-notifications
tags:
  - parent
  - notifications
# Journey: Parent notification center (list, empty/error states, mark-all-read).
# Auth-gated: requires a logged-in PARENT session (see implementation plan).
# No runtime coverage is claimed.
---
- launchApp:
    clearState: false

# --- Notifications tab ---
- assertVisible:
    id: parent-tab-notifications # app/(parent)/(tabs)/_layout.tsx:73 pattern
    timeout: 10000
- tapOn:
    id: parent-tab-notifications

# --- One of three states renders. Anchor on whichever is present. ---
# Populated list -> mark-all-read bar (real testID):
- assertVisible:
    id: mark-all-as-read-button # notification-header.tsx:26
    optional: true
# Empty state (real testID):
- assertVisible:
    id: notification-empty # notification-states.tsx:77
    optional: true
# Error state (real testID):
- assertVisible:
    id: notification-error # notification-states.tsx:61
    optional: true

# --- If list is populated, exercise mark-all-as-read ---
- tapOn:
    id: mark-all-as-read-button
    optional: true

# TODO(testid): parent-notification-item-{id} — NotificationListView rows expose
#   no per-item testID, so "tap a notification -> deep link" is not driveable.
#   Anchor on the screen title to confirm we're on the right screen:
- assertVisible:
    text: Notifications # parent.notifications.title
    optional: true
